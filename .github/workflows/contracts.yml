name: Contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]

jobs:
  test:
    name: Build, test, format
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Check frontend ABI fragments
        run: node script/check-frontend-abi.mjs

      - name: Test
        run: forge test -vvv
