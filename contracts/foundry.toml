[profile.default]
src               = "src"
out               = "out"
libs              = ["lib"]
test              = "test"
script            = "script"
solc_version      = "0.8.24"
# Robinhood Chain 46630 is an Arbitrum Orbit chain. Pinning to `paris` keeps the
# bytecode free of MCOPY/TSTORE (cancun) so the identical-bytecode mirror deploy to
# Arbitrum Sepolia 421614 in Section 2 cannot diverge on opcode support.
evm_version       = "paris"
optimizer         = true
optimizer_runs    = 200
bytecode_hash     = "none"
cbor_metadata     = false
ffi               = false
fs_permissions    = [
  { access = "read", path = "./out" },
  { access = "read", path = "../runner/src/strategies" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../deployments/.pending" },
]

[profile.ci]
verbosity         = 4
fuzz              = { runs = 1000 }

[fmt]
line_length       = 120
tab_width         = 4
bracket_spacing   = false
int_types         = "long"
quote_style       = "double"
number_underscore = "thousands"

[rpc_endpoints]
rh_testnet        = "${RH_TESTNET_RPC_URL}"
arb_sepolia       = "${ARB_SEPOLIA_RPC_URL}"

[etherscan]
arb_sepolia       = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
